<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Integrations — Opero</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f9fafb;color:#111827}
nav{background:#fff;border-bottom:1px solid #e5e7eb;height:64px;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:10}
.nav-inner{max-width:1180px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;text-decoration:none;color:#111}
.logo img{width:30px;height:30px;object-fit:contain}
.nav-right{display:flex;gap:12px}
.btn-login{padding:7px 16px;border-radius:8px;border:1px solid #e5e7eb;font-size:0.875rem;text-decoration:none;color:#374151}
.btn-trial{padding:7px 16px;border-radius:8px;background:#0A4FB3;color:#fff;font-size:0.875rem;text-decoration:none;font-weight:600}
.hero{text-align:center;padding:64px 24px 48px;max-width:700px;margin:0 auto}
.hero h1{font-size:2.2rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:12px}
.hero p{font-size:1rem;color:#6b7280;line-height:1.7}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 24px 32px;max-width:900px;margin:0 auto}
.filter-btn{padding:7px 16px;border-radius:100px;border:1.5px solid #e5e7eb;background:#fff;font-size:0.85rem;font-weight:500;color:#374151;cursor:pointer;transition:all 0.15s}
.filter-btn:hover,.filter-btn.active{border-color:#0A4FB3;background:#eff6ff;color:#0A4FB3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:1180px;margin:0 auto;padding:0 24px 80px}
.int-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:box-shadow 0.15s,transform 0.15s;cursor:pointer}
.int-card:hover{box-shadow:0 8px 24px rgba(0,0,0,0.08);transform:translateY(-2px)}
.int-logo{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:4px}
.int-name{font-weight:700;font-size:0.95rem;color:#111}
.int-category{font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#9ca3af}
.int-badge{font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:100px}
.badge-live{background:#dcfce7;color:#16a34a}
.badge-soon{background:#f1f5f9;color:#64748b}
footer{background:#111827;padding:32px 24px;text-align:center;font-size:0.82rem;color:rgba(255,255,255,0.4)}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="logo" href="/landing.html"><img src="/logo.PNG" alt="Opero"/>Opero</a>
    <div class="nav-right">
      <a href="/login" class="btn-login">Log in</a>
      <a href="/login" class="btn-trial">14-day free trial →</a>
    </div>
  </div>
</nav>

<div class="hero">
  <h1>Integrations & Partners</h1>
  <p>Opero connects with the platforms and tools your team already uses — from booking channels to dynamic pricing and payments.</p>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filter('all')">All</button>
  <button class="filter-btn" onclick="filter('booking')">Booking Channels</button>
  <button class="filter-btn" onclick="filter('pricing')">Dynamic Pricing</button>
  <button class="filter-btn" onclick="filter('payments')">Payments</button>
  <button class="filter-btn" onclick="filter('calendar')">Calendar Sync</button>
  <button class="filter-btn" onclick="filter('export')">Export</button>
</div>

<div class="grid" id="grid"></div>

<footer>© 2026 Opero. All rights reserved.</footer>

<script>
const integrations = [
  {name:'Airbnb',logo:'🏠',bg:'#fff0f0',category:'booking',label:'Booking Channels',badge:'live'},
  {name:'Booking.com',logo:'🌐',bg:'#e8f0fe',category:'booking',label:'Booking Channels',badge:'live'},
  {name:'VRBO',logo:'🏡',bg:'#f0f4ff',category:'booking',label:'Booking Channels',badge:'live'},
  {name:'iCal',logo:'📅',bg:'#f0fdf4',category:'calendar',label:'Calendar Sync',badge:'live'},
  {name:'PriceLabs',logo:'📊',bg:'#eff6ff',category:'pricing',label:'Dynamic Pricing',badge:'live'},
  {name:'Stripe',logo:'💳',bg:'#f5f3ff',category:'payments',label:'Payments',badge:'live'},
  {name:'PayPal',logo:'🅿️',bg:'#e8f0fe',category:'payments',label:'Payments',badge:'live'},
  {name:'PDF Export',logo:'📄',bg:'#fff7ed',category:'export',label:'Export',badge:'live'},
  {name:'CSV Export',logo:'📊',bg:'#f0fdf4',category:'export',label:'Export',badge:'live'},
  {name:'Email',logo:'📧',bg:'#fafafa',category:'booking',label:'Notifications',badge:'live'},
  {name:'SMS',logo:'💬',bg:'#f0fdf4',category:'booking',label:'Notifications',badge:'soon'},
  {name:'API Access',logo:'🔗',bg:'#f8fafc',category:'booking',label:'Developer',badge:'soon'},
];

function render(list) {
  document.getElementById('grid').innerHTML = list.map(i => `
    <div class="int-card">
      <div class="int-logo" style="background:${i.bg}">${i.logo}</div>
      <div class="int-name">${i.name}</div>
      <div class="int-category">${i.label}</div>
      <span class="int-badge ${i.badge === 'live' ? 'badge-live' : 'badge-soon'}">${i.badge === 'live' ? 'Available' : 'Coming soon'}</span>
    </div>
  `).join('');
}

function filter(cat) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render(cat === 'all' ? integrations : integrations.filter(i => i.category === cat));
}

render(integrations);
</script>
</body>
</html>
